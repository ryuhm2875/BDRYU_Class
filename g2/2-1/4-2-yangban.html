/* 레이아웃: 제목 → 큰 QR → 주소 → 열기 버튼, 화면 한가운데 세로 한 줄 */
:root{
  --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --tile:#f5f5f7; --link:#0066cc; --btn:#0071e3; --btnfg:#ffffff;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f7;--muted:#a1a1a6;--tile:#1d1d1f;--link:#2997ff;--btn:#0071e3;--btnfg:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f7;--muted:#a1a1a6;--tile:#1d1d1f;--link:#2997ff;--btn:#0071e3;--btnfg:#fff;color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;min-height:100vh;display:flex;flex-direction:column}
.back{font-size:15px;color:var(--link);text-decoration:none;align-self:flex-start}
.back:hover{text-decoration:underline}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-top:12px}
.eyebrow{font-size:17px;font-weight:500;color:var(--muted);margin:0}
h1{font-size:clamp(40px,6vw,64px);font-weight:800;letter-spacing:-0.025em;line-height:1.05;margin:0}
.qr{background:#fff;border-radius:24px;padding:clamp(12px,2vw,20px);width:min(52vh,78vw,440px);box-shadow:0 2px 24px rgba(0,0,0,.08)}
.qr svg{display:block;width:100%;height:auto}
.how{font-size:clamp(17px,2.2vw,21px);color:var(--muted);margin:4px 0 0;line-height:1.5}
.url{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;word-break:break-all;user-select:all}
.open{display:inline-block;margin-top:4px;background:var(--btn);color:var(--btnfg);text-decoration:none;font-size:17px;font-weight:500;padding:12px 26px;border-radius:999px}
.open:hover{filter:brightness(1.08)}
.open:focus-visible,.back:focus-visible{outline:3px solid var(--link);outline-offset:3px}
</style>
