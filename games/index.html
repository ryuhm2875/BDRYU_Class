<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>류봉두의 게임 주머니 · 류봉두의 즐거운 국어 수업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 레이아웃: 큰 제목 → 게임 카드 목록 (학년 페이지와 같은 결) */
:root{
  --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --faint:#86868b; --tile:#f5f5f7; --line:#d2d2d7; --link:#0066cc; --chip:#e8e8ed;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f7;--muted:#a1a1a6;--faint:#6e6e73;--tile:#1d1d1f;--line:#38383c;--link:#2997ff;--chip:#2c2c2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f7;--muted:#a1a1a6;--faint:#6e6e73;--tile:#1d1d1f;--line:#38383c;--link:#2997ff;--chip:#2c2c2e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 72px}
.back{font-size:15px;color:var(--link);text-decoration:none}
.back:hover{text-decoration:underline}
header{text-align:center;margin-top:clamp(40px,7vw,72px)}
.eyebrow{font-size:17px;font-weight:500;color:var(--muted);margin:0 0 8px}
h1{font-size:clamp(36px,6vw,56px);font-weight:800;letter-spacing:-0.025em;line-height:1.08;margin:0}
.lead{font-size:17px;color:var(--muted);margin:14px 0 0}
.games{display:flex;flex-direction:column;gap:12px;margin-top:clamp(36px,6vw,56px)}
.game{display:flex;align-items:center;gap:22px;background:var(--tile);border-radius:22px;padding:22px 26px;text-decoration:none;color:inherit;transition:transform .25s ease}
a.game:hover{transform:scale(1.012)}
a.game:focus-visible{outline:3px solid var(--link);outline-offset:3px}
.thumb{flex:none;width:92px;height:92px;border-radius:20px;display:grid;place-items:center;font-size:46px}
.info{min-width:0;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:13px;font-weight:700;color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 10px}
.name{font-size:clamp(21px,3vw,26px);font-weight:700;letter-spacing:-0.015em;margin:0;line-height:1.25}
.desc{font-size:15px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.go{flex:none;font-size:17px;font-weight:500;color:var(--link);white-space:nowrap}
.game.off{color:var(--faint)} .game.off .go{color:var(--faint)}
.gw{position:relative}
.game.has-extra .go{transform:translateY(-14px)}
.extra{position:absolute;right:26px;top:50%;transform:translateY(4px);font-size:15px;font-weight:700;color:var(--link);text-decoration:none;background:#fff;border-radius:999px;padding:4px 12px;white-space:nowrap}
.extra:hover{text-decoration:underline}
@media (max-width:560px){.game{flex-wrap:wrap;gap:14px;padding:20px}.thumb{width:68px;height:68px;font-size:34px;border-radius:16px}.go{width:100%}.game.has-extra .go{transform:none}.extra{top:auto;bottom:18px;right:20px;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">‹ 처음으로</a>

  <header>
    <p class="eyebrow">고흥대서중학교 류봉두의 즐거운 국어 수업</p>
    <h1>류봉두의 게임 주머니</h1>
    <p class="lead">수업에서 함께 하는 국어 놀이</p>
  </header>

  <main class="games" id="games"></main>
</div>

<script>
/* ================================================================
   여기만 고치면 됩니다.
   게임을 올렸으면 아래 목록에 한 덩어리를 넣어 주세요.

   href : 같은 폴더의 파일이면 "파일이름.html", 다른 사이트면 https:// 주소
   자료 : (있을 때만) 플레이 아래에 붙는 링크. 예) 자료: { 이름: "공략집", href: "파일.pdf" }
   (다른 사이트 주소는 새 탭에서 열립니다. href를 비우면 "준비 중")
   ================================================================ */
const 게임 = [
  { 이름: "품사 경매", 그림: "🔨", 색: "#FEE500",
    태그: ["1학년", "단어의 갈래 · 품사", "태블릿 팀 대항전"],
    설명: "단어를 사고, 문장을 만들고, 품사를 증명하라! 비밀·공개 입찰, 변신·함정 카드, 2~8팀.",
    href: "pumsa-auction.html" },
  { 이름: "유산 경매", 그림: "🏺", 색: "#E6C98F",
    태그: ["역사②", "삼국~고려 문화유산", "태블릿 팀 대항전"],
    설명: "유산을 사고, 전시실을 꾸미고, 진품을 가려내라! 감정가·가품·세트 미션, 2~8팀.",
    href: "yusan-auction.html",
    자료: { 이름: "공략집", href: "yusan-guide.pdf" } },
  { 이름: "성분 낙하", 그림: "🪂", 색: "#BFE3FF",
    태그: ["3학년", "문장의 짜임과 양상", "교실 TV 반 대항전"],
    설명: "하늘에서 떨어지는 어절을 알맞은 문장 성분 바구니로! 2~5모둠, 순한맛부터 매운맛까지 100문장.",
    href: "seongbun-drop.html" },
  { 이름: "봉두문고 · 소설 속으로", 그림: "📚", 색: "#F3E3C3",
    태그: ["2학년", "소설 읽기", "혼자 하는 RPG"],
    설명: "책을 펼치면 소설 속 주인공이 됩니다. 「수난이대」, 「하늘은 맑건만」.",
    href: "https://ryuhm2875.github.io/bongdoomoongo-sunanedae/" },
  { 이름: "고흥FC 드림 프로젝트", 그림: "⚽", 색: "#C8EBC4",
    태그: ["축구부", "3년 육성 시뮬레이션", "학번 로그인"],
    설명: "고흥대서중 축구부 학생선수가 되어 입학부터 졸업까지! 훈련, 경기 선택, 8가지 엔딩.",
    href: "https://ryuhm2875.github.io/FC-GOHENG/" },
];
/* ================= 아래는 고치지 않아도 됩니다 ================= */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("games").innerHTML = 게임.map(g => {
  const ext = /^https?:/.test(g.href || "");
  const inner = `<span class="thumb" style="background:${esc(g.색)}">${g.그림}</span>
    <span class="info"><span class="tags">${g.태그.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</span>
      <h2 class="name">${esc(g.이름)}</h2><p class="desc">${esc(g.설명)}</p></span>
    <span class="go">${g.href ? (ext ? "플레이 ↗" : "플레이 ›") : "준비 중"}</span>`;
  const card = g.href
    ? `<a class="game${g.자료 ? " has-extra" : ""}" href="${esc(g.href)}"${ext ? ' target="_blank" rel="noopener"' : ""}>${inner}</a>`
    : `<div class="game off">${inner}</div>`;
  return g.자료
    ? `<div class="gw">${card}<a class="extra" href="${esc(g.자료.href)}" target="_blank" rel="noopener">📖 ${esc(g.자료.이름)} ↗</a></div>`
    : card;
}).join("");
</script>
</body>
</html>
