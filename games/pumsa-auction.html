:root{--ink:#1C1B19;--paper:#FAFAF7;--y:#FEE500;--yl:#FFF6A8;--line:#E4E2DC;--gray:#8E8E8E;--soft:#EEECE6;--green:#1E9E57;--gl:#E3F6EA;--red:#ED4956;--rl:#FFE3E6;--dark:#141414;--d2:#232323}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'NSK',"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,textarea{font-family:inherit;user-select:text;-webkit-user-select:text}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
mark{background:linear-gradient(transparent 55%,var(--y) 55%);color:inherit;padding:0 2px}

/* ================= 칠판 ================= */
body.board{background:#cfcdc6;overflow:hidden}
#board{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--paper);transform-origin:center center;flex:none;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.stage.dark{background:var(--dark);color:#fff}
.hd{position:absolute;top:22px;left:48px;font-size:15px;font-weight:500;letter-spacing:-.2px;z-index:5}
.hd b{font-weight:800}
.dark .hd{color:#bbb}.dark .hd b{color:var(--y)}
.tr{position:absolute;top:22px;right:48px;font-size:15px;font-weight:700;color:var(--gray);z-index:5}

.bar{position:absolute;left:48px;right:48px;bottom:18px;display:flex;gap:10px;align-items:center;justify-content:flex-end;z-index:30}
.bar .lft{margin-right:auto;font-size:15px;font-weight:700;color:var(--gray);display:flex;gap:14px;align-items:center}
.pill{padding:11px 22px;border-radius:30px;font-size:17px;font-weight:800;background:var(--soft);white-space:nowrap}

.pill.y{background:var(--y);color:var(--ink)}
.pill.r{background:var(--red);color:#fff}
.pill.sm{padding:8px 16px;font-size:15px}
.dark .pill{background:#2c2c2c;color:#fff}.dark .pill.y{background:var(--y);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--green);margin-right:6px}
.dot.off{background:var(--red)}

/* 인트로 */
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 75% 48%,rgba(254,229,0,.24),transparent 55%),linear-gradient(90deg,#141414 30%,transparent 72%)}
.intro .orig{position:absolute;left:96px;top:150px;font-size:18px;font-weight:800;letter-spacing:6px;color:var(--y)}
.intro h1{position:absolute;left:88px;top:178px;font-size:156px;font-weight:900;letter-spacing:-7px;line-height:1.05;text-shadow:0 8px 40px rgba(0,0,0,.6)}
.intro .meta{position:absolute;left:98px;top:372px;font-size:20px;color:#ddd;font-weight:500}
.intro .meta i{font-style:normal;border:1px solid #888;padding:1px 7px;margin:0 10px;font-size:15px;border-radius:3px}
.intro .meta span{color:var(--y);font-weight:800}
.intro .desc{position:absolute;left:98px;top:414px;width:560px;font-size:19px;color:#cfcfcf;line-height:1.6}
.intro .btns{position:absolute;left:98px;top:500px;display:flex;gap:14px}
.nbtn{padding:15px 32px;border-radius:8px;font-size:23px;font-weight:800;background:#fff;color:#141414}
.nbtn.g{background:rgba(110,110,110,.7);color:#fff}
.chars{position:absolute;display:flex;gap:10px;align-items:flex-end}
.intro .chars{right:120px;bottom:110px}.intro .chars>div{width:180px}
.chars>div:first-child{animation:bob 2.6s ease-in-out infinite}
.chars>div:last-child{animation:bob 2.6s ease-in-out .8s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* 공통 머리 */
.ttl{position:absolute;left:48px;top:62px}
.ttl .ep{font-size:15px;font-weight:800;letter-spacing:3px;color:var(--gray);margin-bottom:6px}
.ttl h2{font-size:34px;font-weight:800;letter-spacing:-1px}

/* 설정 */
.setup .grid{position:absolute;left:48px;top:150px;width:760px;display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:16px}
.opt>label{width:150px;font-size:18px;font-weight:700;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 15px;border-radius:30px;font-size:16px;font-weight:700;background:#fff;border:1.5px solid var(--line);min-width:44px}
.chip.on{background:var(--ink);color:var(--y);border-color:var(--ink)}
.est{position:absolute;right:48px;top:150px;width:360px;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:18px 22px}
.est .ev{font-size:50px;font-weight:900;letter-spacing:-2px;margin:2px 0 6px}
.est .ev.over{color:var(--red)}
.est p{font-size:15px;color:var(--gray);line-height:1.6}
.est .row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px dashed var(--line)}
.warn{margin-top:10px;background:var(--rl);color:#b3263a;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.5}

/* 대기실 */
.lobby .qr{position:absolute;left:48px;top:148px;width:300px;background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:20px;text-align:center}
.lobby .qr svg{width:220px;height:220px;display:block;margin:0 auto}
.lobby .code{font-size:15px;color:var(--gray);font-weight:700;margin-top:10px}
.lobby .code b{display:block;font-size:56px;letter-spacing:8px;color:var(--ink);font-weight:900;line-height:1.1}
.lobby .url{font-size:12px;color:var(--gray);word-break:break-all;margin-top:6px;line-height:1.4}
.slots{position:absolute;left:380px;top:148px;right:48px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.slot{height:200px;border-radius:20px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gray);font-weight:700;position:relative;padding:12px;text-align:center}
.slot.full{border:2px solid var(--ink);background:#fff;color:var(--ink);animation:pop .4s}
.slot .an{font-size:44px;line-height:1}
.slot .tn{font-size:21px;font-weight:800;margin:6px 0 4px;word-break:keep-all}
.slot .mb{font-size:14px;color:var(--gray);line-height:1.5;word-break:keep-all}
.slot .x{position:absolute;top:8px;right:10px;font-size:15px;color:var(--gray);padding:4px}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}

/* 팀 목록 (왼쪽) */
.teams{position:absolute;left:48px;top:136px;width:300px;display:flex;flex-direction:column;gap:7px}
.tm{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;font-size:16px;font-weight:700;background:#fff;border:1.5px solid var(--line);min-height:50px;text-align:left;width:100%}
.tm .an{font-size:20px}
.tm .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .c{font-weight:800;font-size:16px}
.tm .st{font-size:12.5px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap}
.st.ok{background:var(--gl);color:var(--green)}.st.wait{background:#F1F1EE;color:var(--gray)}.st.lead{background:var(--y);color:var(--ink)}.st.out{background:var(--rl);color:#b3263a}
.tm.win{border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.tm.off{opacity:.55}

/* 경매 */
.mission{position:absolute;left:48px;top:84px;font-size:24px;font-weight:800;letter-spacing:-.5px;max-width:860px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stagec{position:absolute;left:390px;top:128px;width:500px;height:470px;display:flex;flex-direction:column;align-items:center}
.mode{display:flex;gap:8px;margin-bottom:16px}

.mode button.on{background:var(--ink);color:var(--y)}
.big{width:340px;height:300px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:var(--y);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}

.big .w.l{font-size:70px}.big .w.xl{font-size:54px}
.big .tag{position:absolute;top:18px;left:20px;font-size:15px;font-weight:800;padding:4px 12px;border-radius:20px;background:var(--ink);color:var(--y)}
.big .bdg{position:absolute;top:18px;right:20px;font-size:14px;font-weight:800;padding:4px 10px;border-radius:20px;background:#fff;border:2px solid var(--ink)}
.big .hint{font-size:16px;margin-top:8px;font-weight:700;color:#5a5000;text-align:center;padding:0 16px}
.big.shift{background:#E4F0FF}.big.shift .hint{color:#1d4f91}
.under{margin-top:22px;font-size:18px;font-weight:700;color:var(--gray);text-align:center;min-height:28px}
.side{position:absolute;right:48px;top:136px;width:270px;text-align:center}
.ring{width:170px;height:170px;margin:0 auto 14px;position:relative}

.prog{font-size:17px;font-weight:700;line-height:1.6}
.price{font-size:15px;color:var(--gray);font-weight:700}
.price b{display:block;font-size:64px;color:var(--ink);font-weight:900;letter-spacing:-2px;line-height:1.1}
.leader{margin-top:6px;font-size:20px;font-weight:800}
.going{margin-top:10px;font-size:26px;font-weight:900;color:var(--red);min-height:36px}
.mboard{margin-top:18px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.mboard h4{font-size:14px;color:var(--gray);margin-bottom:6px}
.mboard li{list-style:none;font-size:14px;font-weight:700;padding:3px 0;display:flex;gap:6px}
.mboard li span{color:var(--gray);font-weight:800;flex:none;width:34px}

/* 공개 결과 */
.reveal{position:absolute;inset:0;background:rgba(250,250,247,.96);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fade .25s}

.bids{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:1100px}

.bidc .an{font-size:30px}.bidc .nm{font-size:14px;font-weight:800;margin:4px 6px;text-align:center;word-break:keep-all;line-height:1.2}

.bidc.top{background:var(--y);border-color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.bidc.zero .v{color:var(--gray);font-size:20px}
.sold{position:absolute;inset:0;z-index:22;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,20,20,.92);color:#fff;animation:fade .2s}
.sold .lbl{font-size:22px;font-weight:800;letter-spacing:8px;color:var(--y)}

/* 에피소드 */
.episode .ep{position:absolute;left:96px;top:170px;font-size:22px;font-weight:800;letter-spacing:10px;color:var(--y)}
.episode h1{position:absolute;left:90px;top:205px;font-size:110px;font-weight:900;letter-spacing:-5px;line-height:1.1}
.episode .mcard{position:absolute;left:98px;top:380px;width:600px;background:var(--y);color:var(--ink);border-radius:18px;padding:22px 26px;animation:flip .7s .3s both}

.episode .mlist{position:absolute;left:98px;top:520px;font-size:16px;color:#aaa;line-height:1.7}
.episode .chars{right:110px;bottom:120px}.episode .chars>div{width:150px}
.episode .meta{position:absolute;left:98px;top:340px;font-size:19px;color:#ccc;font-weight:500}

/* 기본 카드 뽑기 현황 */
.stboard{position:absolute;left:48px;right:48px;top:150px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.strow{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}

.sc{flex:1;height:44px;border-radius:10px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--gray)}
.sc.f{border:2px solid var(--ink);background:var(--yl);color:var(--ink);animation:pop .3s}

/* 문장 만들기 현황 / 판정 */
.bstat{position:absolute;left:48px;top:150px;width:760px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bst{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.bst .nm{flex:1;font-size:19px;font-weight:800}
.judge .presenter{position:absolute;left:48px;top:128px;font-size:22px;font-weight:800}
.judge .presenter b{background:var(--y);padding:2px 12px;border-radius:10px}
.sent{position:absolute;left:48px;right:400px;top:186px;display:flex;flex-wrap:wrap;gap:34px 8px;align-items:flex-start;min-height:200px}
.jc{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}

.jc .p.no{background:var(--rl)!important;color:#b3263a;text-decoration:line-through}
.jc.err .t{background:var(--rl);border-color:var(--red);color:#b3263a}

.jc.trap .t{background:#2a2a2a;color:#fff;border-color:#2a2a2a}
.jc .why{position:absolute;top:-22px;font-size:12px;font-weight:800;color:var(--red);white-space:nowrap}
.jc .sh{font-size:12px;font-weight:800;padding:2px 8px;border-radius:10px;cursor:pointer}
.jc .sh.ok{background:var(--gl);color:var(--green)}.jc .sh.ng{background:var(--rl);color:#b3263a}
.jc .base{font-size:11px;color:var(--gray);font-weight:700}
.plain{position:absolute;left:48px;right:48px;top:448px;font-size:24px;font-weight:800;padding:12px 18px;background:#fff;border-radius:14px;border:1.5px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{position:absolute;right:48px;top:62px;width:330px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 16px;font-size:14px}

.score .r.neg{color:#b3263a}
.score .tot{display:flex;justify-content:space-between;font-size:22px;font-weight:900;border-top:2px solid var(--ink);margin-top:4px;padding-top:4px}
.mchk{position:absolute;left:48px;top:512px;width:760px;columns:2;column-gap:24px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 16px}

.mchk button{display:flex;gap:8px;width:100%;text-align:left;font-size:14px;font-weight:700;padding:2px 0}
.mchk .ck{width:18px;height:18px;border-radius:5px;border:2px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px}
.mchk .ck.on{background:var(--ink);color:var(--y)}

/* 순위 */
.rank h2{position:absolute;left:96px;top:64px;font-size:54px;font-weight:900;letter-spacing:-2px}
.rank h2 em{font-style:normal;color:var(--y)}
.rank .sub{position:absolute;left:100px;top:136px;color:#aaa;font-size:18px}
.rk{position:absolute;top:186px;left:70px;display:flex;gap:18px}
.rk .it{width:270px;height:290px;position:relative;opacity:0;animation:pop .5s forwards}
.rk .n{font-size:290px;font-weight:900;line-height:.8;color:#141414;-webkit-text-stroke:5px #6b6b6b;position:absolute;left:-6px;bottom:-4px}

.rk .pc{position:absolute;right:0;bottom:0;width:170px;height:240px;border-radius:12px;background:#262626;padding:14px;display:flex;flex-direction:column;justify-content:flex-end}
.rk .it.g .pc{background:var(--y);color:#141414}
.rk .pc b{font-size:24px;line-height:1.15;word-break:keep-all}.rk .pc span{font-size:15px;opacity:.8;margin-top:4px}
.rk .pc .an{font-size:40px;position:absolute;top:14px;left:14px}
.rest{position:absolute;right:48px;top:186px;width:280px;display:flex;flex-direction:column;gap:6px}

.best{position:absolute;left:96px;right:48px;bottom:84px;font-size:24px;color:#ddd;font-weight:700}
.best b{color:var(--y)}
.rank .chars{right:60px;bottom:70px}.rank .chars>div{width:110px}

/* 떨이 시장 */
.mkt{position:absolute;left:390px;right:350px;top:150px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.mc{width:130px;height:110px;border-radius:16px;background:var(--y);border:2.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.mc .w{font-size:28px;font-weight:900}.mc .p{font-size:12px;font-weight:800;margin-top:2px}
.mc.gone{background:#fff;border-style:dashed;opacity:.6}
.mc .by{position:absolute;bottom:6px;font-size:12px;font-weight:800}

/* 모달 */
.modal{position:absolute;inset:0;background:rgba(20,20,20,.55);z-index:40;display:flex;align-items:center;justify-content:center;animation:fade .15s}
.mbox{background:var(--paper);border-radius:24px;padding:26px 30px;min-width:440px;max-width:1100px;max-height:660px;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);color:var(--ink)}
.mbox h3{font-size:26px;font-weight:900;margin-bottom:12px}
.mbox p{font-size:17px;line-height:1.6;margin-bottom:12px}
.mbox .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.kp{display:grid;grid-template-columns:repeat(3,90px);gap:8px;justify-content:center;margin:10px 0}
.kp button{height:54px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:28px;font-weight:800}
.kpv{font-size:46px;font-weight:900;text-align:center;letter-spacing:-2px}
.rules{columns:2;column-gap:36px;font-size:16px;line-height:1.65}

.rules li{margin-left:18px}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;font-size:17px;font-weight:700;z-index:50;animation:fade .2s;white-space:nowrap}

/* ================= 태블릿 ================= */
body.pad{background:var(--paper);min-height:100%}
#pad{max-width:860px;margin:0 auto;padding:16px 16px 120px;min-height:100vh}
.ph{display:flex;align-items:center;gap:10px;padding:6px 0 14px;border-bottom:1.5px solid var(--line);margin-bottom:16px}
.ph .an{font-size:30px}
.ph .tn{font-size:22px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph .co{font-size:22px;font-weight:900;background:var(--y);padding:4px 14px;border-radius:30px}
.ph .cn{font-size:13px;font-weight:700;color:var(--gray)}
.pt{font-size:13px;color:var(--gray);font-weight:700;margin-bottom:12px}
.pt b{color:var(--ink)}
.card{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.card h3{font-size:20px;font-weight:900;margin-bottom:10px}
.fld{display:block;width:100%;font-size:20px;font-weight:700;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;margin-bottom:10px;outline:none}
.fld:focus{border-color:var(--ink)}
.mem{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mem .fld{margin:0}
.bb{display:block;width:100%;padding:18px;border-radius:18px;font-size:22px;font-weight:900;background:var(--ink);color:var(--y);margin-top:10px}
.bb.y{background:var(--y);color:var(--ink)}
.bb.l{background:var(--soft);color:var(--ink)}
.wait{text-align:center;padding:30px 10px}
.wait .chars{position:static;justify-content:center;margin:10px auto}
.wait .chars>div{width:110px}
.wait h2{font-size:26px;font-weight:900;margin:10px 0 6px}

  beep(f=660,d=.12,type='sine',v=.18,when=0){ if(!this.on) return; try{ this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)(); const c=this.ctx, o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,c.currentTime+when); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+when+d); o.connect(g); g.connect(c.destination); o.start(c.currentTime+when); o.stop(c.currentTime+when+d+.02);}catch(e){} },
  tick(){ this.beep(880,.08,'square',.08); },
  sold(){ [523,659,784,1047].forEach((f,i)=>this.beep(f,.22,'triangle',.18,i*.09)); },
  reveal(){ [392,523].forEach((f,i)=>this.beep(f,.15,'triangle',.15,i*.12)); },
  bad(){ this.beep(196,.3,'sawtooth',.1); },

};

/* ---------------- 조사 형태, 문장 이어 붙이기 ---------------- */
function particleForm(w, prev){
  const f = PFORMS[w]; if(!f) return w;
  const last = prev ? prev[prev.length-1] : '';
  const j = jongOf(last);
  if (j<=0) return f[1];
  if (w==='(으)로' && j===8) return f[1];
  return f[0];
}
/* items: [{card, form, comma}] → 화면에 보일 글자들 */
function displayForms(items){
  const out=[];
  items.forEach((it,i)=>{
    const c=it.card; let t;
    if (c.k==='trap') t=c.w;
    else if (c.e) t=(it.form||c.w);
    else if (isParticle(c) && PFORMS[c.w]) t=particleForm(c.w, i>0?out[i-1]:'');
    else t=c.w;
    out.push(t);
  });
  return out;
}
function isParticle(c){ return c.p==='조사' || c.g==='관계언'; }
function sentenceText(items, end){
  const ds=displayForms(items); let s='';
  items.forEach((it,i)=>{
    const glue = i>0 && isParticle(it.card) && !items[i-1].comma;
    s += (i>0 && !glue ? ' ' : '') + ds[i] + (it.comma ? ',' : '');
  });
  return s + (s ? (end||'.') : '');
}

/* ---------------- 활용 오류 의심, 변신 판단 ---------------- */
function stemOf(base){ return base.endsWith('다') ? base.slice(0,-1) : base; }
function adjFlag(base, form){
  if(!form || form===base) return null;
  const st=stemOf(base), last=st[st.length-1];
  if (form.endsWith('는다')) return '형용사 + ‘-는다’?';
  if (form.length>=2 && form.endsWith('다')){
    const pre=form[form.length-2];
    if (isH(pre) && isH(last) && jongOf(last)===0 && pre===addJong(last,4) && form.slice(0,-2)===st.slice(0,-1)) return '형용사 + ‘-ㄴ다’?';
  }
  if (form===st+'는') return '형용사 + ‘-는’?';
  if (form===st+'자') return '형용사 청유형?';
  if (form.endsWith('라') && form.length>=2 && form[0]===st[0] && form.length<=st.length+2){
    const v=vowelOf(form[form.length-2]);
    if ([0,1,4,6,9,10,14].includes(v)) return '형용사 명령형?';
  }
  return null;
}
function verbOnlyForm(base, form){
  if(!form) return false;
  const st=stemOf(base), last=st[st.length-1];
  if (form.endsWith('는다')) return true;
  if (form.length>=2 && form.endsWith('다') && isH(last) && jongOf(last)===0 && form[form.length-2]===addJong(last,4) && form.slice(0,-2)===st.slice(0,-1)) return true;
  if (form===st+'는' || form===st+'자') return true;
  if (form.endsWith('라') && form[0]===st[0] && form!==base) return true;
  return false;
}

/* =====================================================================
   데이터베이스 (Firebase 또는 시험용 로컬)
   ===================================================================== */
const DB = { api:null, kind:'none', offset:0, ok:false, connCbs:[],
  now(){ return Date.now()+this.offset; },
  onConn(cb){ this.connCbs.push(cb); cb(this.ok); },
  _conn(v){ this.ok=v; this.connCbs.forEach(f=>f(v)); },
  async init(){
    if (this.api) return this.api;
    const qs=new URLSearchParams(location.search);
    if (qs.has('local')) { this.api=localDB(); this.kind='local'; this._conn(true); return this.api; }
    const load = src => new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load')); document.head.appendChild(s); });
    await load(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
    await load(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database-compat.js`);
    if (!firebase.apps.length) firebase.initializeApp(FB_CFG);
    const d=firebase.database();
    d.ref('.info/serverTimeOffset').on('value', s=>{ this.offset=s.val()||0; });
    d.ref('.info/connected').on('value', s=>this._conn(!!s.val()));
    this.kind='firebase';
    this.api={
      set:(p,v)=>d.ref(p).set(clean(v)),
      update:(p,v)=>d.ref(p).update(clean(v)),
      remove:p=>d.ref(p).remove(),
      push:(p,v)=>d.ref(p).push(clean(v)).key,
      get:p=>d.ref(p).get().then(s=>s.val()),
      on:(p,cb)=>{ const r=d.ref(p), f=s=>cb(s.val()); r.on('value',f); return ()=>r.off('value',f); },
      onAdd:(p,cb)=>{ const r=d.ref(p), f=s=>cb(s.key,s.val()); r.on('child_added',f); return ()=>r.off('child_added',f); }
    };
    return this.api;
  }
};
/* 같은 브라우저 안 여러 창끼리 시험해 볼 때만 쓰는 가짜 DB (?local=1) */
function localDB(){
  const ch=new BroadcastChannel('pa-local'); const KEY='pa-local-db';
  let tree=ls.get(KEY,{}); const subs=[];
  const parts=p=>p.split('/').filter(Boolean);
  const get=p=>parts(p).reduce((o,k)=>o==null?undefined:o[k],tree);
  const setAt=(p,v)=>{ const ks=parts(p); let o=tree; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } if(v==null) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]]=clean(v); };
  const rel=(a,b)=>a===b||a.startsWith(b+'/')||b.startsWith(a+'/');
  function notify(p){ subs.forEach(s=>{ if(!rel(s.p,p)) return;
    if(s.type==='v') s.cb(clean(get(s.p)) ?? null);
    else { const o=obj(get(s.p)); Object.keys(o).sort().forEach(k=>{ if(!s.known.has(k)){ s.known.add(k); s.cb(k,clean(o[k])); } }); } }); }
  function apply(op){ if(op.o==='set') setAt(op.p,op.v); else if(op.o==='upd') Object.entries(op.v).forEach(([k,v])=>setAt(op.p+'/'+k,v)); else if(op.o==='rm') setAt(op.p,null); notify(op.p); }
  ch.onmessage=e=>{ tree=ls.get(KEY,tree); apply(e.data); };
  const run=op=>{ apply(op); ls.set(KEY,tree); ch.postMessage(op); return Promise.resolve(); };
  return {
    set:(p,v)=>run({o:'set',p,v:clean(v)}), update:(p,v)=>run({o:'upd',p,v:clean(v)}), remove:p=>run({o:'rm',p}),
    push:(p,v)=>{ const k=Date.now().toString(36)+uid(); run({o:'set',p:p+'/'+k,v:clean(v)}); return k; },
    get:p=>Promise.resolve(clean(get(p)) ?? null),
    on:(p,cb)=>{ const s={type:'v',p,cb}; subs.push(s); setTimeout(()=>cb(clean(get(p)) ?? null)); return ()=>subs.splice(subs.indexOf(s),1); },
    onAdd:(p,cb)=>{ const s={type:'a',p,cb,known:new Set()}; subs.push(s); setTimeout(()=>notify(p)); return ()=>subs.splice(subs.indexOf(s),1); }
  };
}

function cardPub(c, opt={}){
  if(!c) return null;
  const o={id:c.id, w:c.w};
  if (c.st) { o.st=1; o.g=c.g; if(c.e) o.e=1; if(c.cop) o.cop=1; }
  else if (c.k==='shift') { o.k='shift'; o.alt=c.alt; if(c.e) o.e=1; }
  else if (c.k==='trap') { o.p=c.p; }        /* 함정은 평범한 카드처럼 보이게 */
  else { o.p=c.p; if(c.s) o.s=c.s; if(c.e) o.e=1; if(c.cop) o.cop=1; if(c.nm) o.nm=1; }
  if (c.paid!=null) o.paid=c.paid;
  if (opt.reveal && c.k==='trap') { o.trap=1; }
  return o;
}
function buildPub(){
  const s=S, au=s.au;
  const pub={ts:DB.now(), phase:s.phase, code:s.code, rounds:s.cfg.rounds, round:s.round, idx:s.idx, per:(s.deck[s.round]||[]).length,
    finalMin:s.cfg.finalMin,
    teams:s.teams.map(t=>({id:t.id,name:t.name,members:t.members,cid:t.cid||'',an:t.an,coins:t.coins,starter:t.starter||0,bought:t.bought||0,
      hand:t.hand.map(id=>cardPub(C(id))), sub:!!s.subs[t.id], fix:!!s.fixReq[t.id]})),
    missions:s.missions.slice(0, s.phase==='intro'||s.phase==='setup'||s.phase==='lobby'||s.phase==='starter' ? 0 : s.round+1).map((m,i)=>({id:m,t:MISSION_BY[m].t,r:i+1})),
  };
  if (au) pub.au={card:cardPub(C(au.cid)), mode:au.mode, status:au.status, deadline:au.deadline||0, price:au.price||0, leader:au.leader||'', duel:au.duel||[], bidIn:au.bidIn||[], reveal:au.reveal||[], result:au.result||null};
  if (s.market) pub.market={deadline:s.market.deadline, cards:s.unsold.map(id=>Object.assign(cardPub(C(id)),{by:C(id).owner||''}))};
  if (s.build) pub.build={deadline:s.build.deadline};
  if (s.judge){ const j=s.judge; pub.judge={tid:j.order[j.i]||'', presenter:j.presenter||'', i:j.i, n:j.order.length,
      res:Object.fromEntries(Object.entries(j.res).filter(([k,r])=>r.state!=='pending').map(([k,r])=>[k,{state:r.state,total:scoreOf(k).total}]))}; }
  if (s.phase==='rank') pub.rank=rankList().map(r=>({tid:r.t.id,total:r.sc.total}));
  return pub;
}

/* ---------- 덱 만들기 ---------- */
const MISSION_BY = Object.fromEntries(MISSIONS.map(m=>[m.id,m]));
function memberNames(){ const set=new Set(); S.teams.forEach(t=>t.members.forEach(n=>{ n=String(n).trim(); if(n && n.length<=6) set.add(n); })); return [...set]; }
function genDeck(){
  const cfg=S.cfg, R=cfg.rounds, P=cfg.perRound, N=R*P;
  const spOn = cfg.specialFrom>0 && cfg.specialFrom<=R;
  const spRounds = spOn ? R-cfg.specialFrom+1 : 0;
  let nSp = spOn ? Math.max(spRounds>=1 && N>=12 ? 2 : 0, Math.round(N*0.07)) : 0;
  nSp = Math.min(nSp, spRounds*P, SHIFT.length+TRAP.length);
  const W={명사:20,대명사:6,수사:4,동사:13,형용사:12,관형사:9,부사:11,조사:13,감탄사:5};
  const base=N-nSp, tot=Object.values(W).reduce((a,b)=>a+b,0);
  const cnt={}; let used=0; const rem=[];
  for(const p in W){ const x=base*W[p]/tot; cnt[p]=Math.floor(x); used+=cnt[p]; rem.push([p,x-cnt[p]]); }
  rem.sort((a,b)=>b[1]-a[1]); for(let i=0;used<base;i++,used++) cnt[rem[i%rem.length][0]]++;
  /* 특수 카드: 변신과 함정 반반 */
  const sp=[]; for(let i=0;i<nSp;i++) sp.push({k: i%2===0 ? 'shift':'trap'});
  let slots=[]; for(const p in cnt) for(let i=0;i<cnt[p];i++) slots.push({p});
  /* 이름 카드 */
  const names = cfg.nameCards ? shuffle(memberNames()) : [];
  let nName = Math.min(names.length, Math.max(0, Math.round(R*0.8)), Math.floor((cnt['명사']||0)/2));
  for(const sl of slots){ if(nName<=0) break; if(sl.p==='명사'){ sl.name=names.pop(); nName--; } }
  /* 라운드에 나누기 */
  const rounds=Array.from({length:R},()=>[]);
  const spR = shuffle(Array.from({length:nSp},(_,i)=>cfg.specialFrom-1+(i%Math.max(1,spRounds))));
  sp.forEach((x,i)=>rounds[spR[i]].push(x));
  slots=shuffle(slots); let r=0;
  for(const sl of slots){ while(rounds[r].length>=P) r=(r+1)%R; rounds[r].push(sl); r=(r+1)%R; }
  /* 라운드마다 용언 1장 이상 */
  const isY=x=>x.p==='동사'||x.p==='형용사';
  if (P>=3) rounds.forEach((rd,ri)=>{ if(rd.some(isY)) return;
    for(const other of rounds){ const ys=other.filter(isY); if(ys.length>=2){ const a=other.indexOf(ys[0]); const bi=rd.findIndex(x=>!x.k&&!isY(x)); if(bi>=0){ [other[a],rd[bi]]=[rd[bi],other[a]]; break; } } } });
  /* 단어 고르기 (지난 게임에 나온 말은 뒤로) */
  const hist=new Set(ls.get(LS_H,[]).flat());
  const pools={};
  const pool=p=>{ if(!pools[p]||!pools[p].length){ const list=BANK.filter(b=>b.p===p&&!b.nm); const fresh=shuffle(list.filter(b=>!hist.has(b.w))), old=shuffle(list.filter(b=>hist.has(b.w))); pools[p]=fresh.concat(old); } return pools[p]; };
  const lessonNames=shuffle(BANK.filter(b=>b.nm));
  const sh=shuffle(SHIFT), tr=shuffle(TRAP);
  S.deck=rounds.map(rd=>shuffle(rd).map(sl=>{
    let d;
    if (sl.k==='shift') d=Object.assign({},sh.pop());
    else if (sl.k==='trap') d=Object.assign({},tr.pop());
    else if (sl.name) d={w:sl.name,p:'명사',s:'고유',nm:1};
    else if (sl.p==='명사' && Math.random()<0.18 && lessonNames.length) d=Object.assign({},lessonNames.pop());
    else d=Object.assign({},pool(sl.p).shift());
    const id=newCardId(); S.cards[id]=Object.assign(d,{id}); return id;
  }));
  /* 미션 */
  const ms=[]; const usedM=new Set();
  for(let i=0;i<R;i++){
    const lv = R<=2 ? i+1 : (i < Math.ceil(R/3) ? 1 : i < Math.ceil(2*R/3) ? 2 : 3);
    let cand=MISSIONS.filter(m=>!usedM.has(m.id) && m.lv===lv && !(m.ex && usedM.has(m.ex)));
    if(!cand.length) cand=MISSIONS.filter(m=>!usedM.has(m.id) && !(m.ex && usedM.has(m.ex)));
    const m=pick(cand); usedM.add(m.id); ms.push(m.id);
  }
  S.missions=ms;
  const h=ls.get(LS_H,[]); h.unshift(S.deck.flat().map(id=>C(id).w)); ls.set(LS_H,h.slice(0,2));
}

function drawStarter(tid, g){
  const t=T(tid); if(!t || (t.starter||0)>=5 || !GROUP_POS[g]) return;
  const W={체언:[['명사',62],['대명사',24],['수사',14]],용언:[['동사',55],['형용사',45]],수식언:[['관형사',45],['부사',55]],관계언:[['조사',1]],독립언:[['감탄사',1]]}[g];
  const p=weighted(W); let d=null;
  const inHand=new Set(t.hand.map(id=>C(id).w));
  if (p==='명사' && S.cfg.nameCards && Math.random()<0.3){ const nm=t.members.find(n=>n && !inHand.has(n)); if(nm) d={w:nm,p:'명사',s:'고유',nm:1}; }
  if (!d){
    const deckW=new Set(S.deck.flat().map(id=>C(id).w));
    let list=BANK.filter(b=>b.p===p && !inHand.has(b.w) && !deckW.has(b.w));
    if(!list.length) list=BANK.filter(b=>b.p===p && !inHand.has(b.w));
    d=Object.assign({},pick(list));
  }
  const id=newCardId(); S.cards[id]=Object.assign(d,{id,st:1,g,owner:tid});
  t.hand.push(id); t.starter=(t.starter||0)+1;
  SND.pop();
}

/* ---------- 경매 ---------- */
function curCardId(){ return (S.deck[S.round]||[])[S.idx]; }
function readyAuction(){ S.au={cid:curCardId(), mode:(S.au&&S.au.mode)||'secret', status:'ready'}; }
function startAuction(){
  const au=S.au; if(!au || au.status!=='ready') return;
  Object.assign(au,{status:'bid', deadline:DB.now()+S.cfg.bidSec*1000, price:0, leader:'', bidIn:[], priv:{}, reveal:[], result:null, duel:null, ticked:0});
  commit();
}
function teamCanBid(t){ return t && t.coins>=0; }
function secretBid(tid, amt){
  const au=S.au, t=T(tid); if(!au||au.status!=='bid'||au.mode!=='secret'||!t) return;
  amt=Math.max(0,Math.min(t.coins, Math.floor(+amt||0)));
  au.priv[tid]=amt; if(!au.bidIn.includes(tid)) au.bidIn.push(tid);
  if (au.bidIn.length>=activeTeams().length) au.deadline=Math.min(au.deadline, DB.now()+700);
  commit();
}
function raise(tid, to){
  const au=S.au, t=T(tid); if(!au||au.status!=='bid'||au.mode!=='open'||!t) return;
  if (au.duel && !au.duel.includes(tid)) return;
  to=Math.floor(+to||0);
  if (tid===au.leader || to<=au.price || to>t.coins || to<1) return;
  au.price=to; au.leader=tid; au.deadline=Math.max(DB.now()+5000, au.deadline - (au.duel?0:0));
  au.deadline=DB.now()+5000; au.ticked=0;
  SND.pop(); commit();
}
function doReveal(){
  const au=S.au; const list=activeTeams().map(t=>({tid:t.id, amt:au.priv[t.id]||0})).sort((a,b)=>b.amt-a.amt);
  const max=list.length?list[0].amt:0; const tops=list.filter(x=>x.amt===max && max>0).map(x=>x.tid);
  au.reveal=list; au.status='reveal';
  au.result = max<=0 ? {type:'unsold'} : tops.length===1 ? {type:'win',tid:tops[0],price:max} : {type:'duel',tids:tops,price:max};
  SND.reveal(); commit();
  setTimeout(()=>{ if(S.au!==au||au.status!=='reveal') return;
    if(au.result.type==='win') sell(au.result.tid, au.result.price);
    else if(au.result.type==='unsold') unsold();
    else startDuel(au.result.tids, au.result.price);
  }, 2600 + list.length*180);
}
function startDuel(tids, price){
  const au=S.au; Object.assign(au,{mode:'open', status:'bid', duel:tids, price, leader:'', deadline:DB.now()+8000, ticked:0, wasSecret:true});
  commit();
}
function sell(tid, price){
  const au=S.au, c=C(au.cid), t=T(tid); if(!t) return;
  c.paid=price; c.owner=tid; t.coins-=price; t.hand.push(c.id);
  au.status='sold'; au.result={type:'win',tid,price}; SND.sold(); commit();
  setTimeout(()=>{ if(S.au===au && au.status==='sold') nextCard(); }, 2600);
}
function unsold(){
  const au=S.au; if(!S.unsold.includes(au.cid)) S.unsold.push(au.cid);
  au.status='unsold'; au.result={type:'unsold'}; SND.bad(); commit();
  setTimeout(()=>{ if(S.au===au && au.status==='unsold') nextCard(); }, 1800);
}
function nextCard(){
  const keepMode=S.au?(S.au.wasSecret?'secret':S.au.mode):'secret';
  S.idx++;
  if (S.idx >= (S.deck[S.round]||[]).length){
    S.round++; S.idx=0;
    if (S.round >= S.cfg.rounds){ S.round=S.cfg.rounds-1; S.au=null; endAuctions(); return; }
    S.phase='episode'; S.au=null; commit(); return;
  }
  S.au={cid:curCardId(), mode:keepMode, status:'ready'}; commit();
}
function endAuctions(){
  if (S.unsold.length){ S.phase='market'; S.market={deadline:DB.now()+90000}; S.teams.forEach(t=>t.bought=0); }
  else startBuild();
  commit();
}
function startBuild(){ S.phase='build'; S.market=null; S.build={deadline:DB.now()+S.cfg.finalMin*60000}; }
function marketBuy(tid, cid){
  const t=T(tid), c=C(cid); if(S.phase!=='market'||!t||!c||c.owner||!S.unsold.includes(cid)) return;
  if ((t.bought||0)>=2 || t.coins<5) return;
  c.owner=tid; c.paid=5; t.coins-=5; t.bought=(t.bought||0)+1; t.hand.push(cid); SND.pop(); commit();
}

/* ---------- 제출, 판정, 점수 ---------- */
function acceptSubmit(tid, payload){
  const t=T(tid); if(!t || !['build','judge'].includes(S.phase)) return;
  if (S.phase==='judge' && !S.fixReq[tid]) return;
  const seen=new Set(); const cards=[];
  for(const it of arr(payload.cards)){ if(!it||!t.hand.includes(it.id)||seen.has(it.id)) continue; seen.add(it.id);
    cards.push({id:it.id, form:String(it.form||'').slice(0,20), tag:it.tag||'', comma:!!it.comma}); }
  if (cards.length<1) return;
  S.subs[tid]={cards, end:['.','?','!'].includes(payload.end)?payload.end:'.', at:DB.now()};
  if (S.fixReq[tid]){ delete S.fixReq[tid]; if(S.judge){ S.judge.res[tid]=Object.assign(freshRes(tid), {fixUsed:true}); if(!S.judge.order.slice(S.judge.i).includes(tid)) S.judge.order.push(tid); if(S.judge.order[S.judge.i]===tid) enterJudge(); } }
  SND.pop(); commit();
}
function subItems(tid){ const sub=S.subs[tid]; if(!sub) return []; return sub.cards.map(x=>Object.assign({},x,{card:C(x.id)})).filter(x=>x.card); }
function effPos(it, res){
  const c=it.card;
  if (c.k==='trap') return null;
  if (c.st) return it.tag===c.p ? c.p : null;
  if (c.k==='shift') return (res && res.shift && res.shift[c.id]===false) ? null : (c.alt.includes(it.tag) ? it.tag : null);
  return c.p;
}
function nextPos(items, i){ const n=items[i+1]; if(!n) return null; const c=n.card; return c.k==='shift' ? n.tag : (c.p); }
function freshRes(tid){
  const items=subItems(tid); const errs={}, shift={};
  items.forEach((it,i)=>{
    const c=it.card;
    if (!c.k && c.p==='형용사' && it.form){ if(adjFlag(c.w,it.form)) errs[c.id]=true; }
    if (c.k==='shift'){
      let ok=true;
      if (c.e){ const vo=verbOnlyForm(c.w,it.form); if(it.tag==='형용사' && vo) ok=false; }
      else { const np=nextPos(items,i); if(np){ const wantCheon = np==='조사'; const wantGwan = ['명사','대명사','수사'].includes(np);
        if (wantCheon && it.tag==='관형사') ok=false; if (wantGwan && it.tag!=='관형사') ok=false; } }
      shift[c.id]=ok;
    }
  });
  return {state:'pending', errs, shift, man:{}, fixUsed:false};
}
function flagsOf(tid){
  const items=subItems(tid); const f={};
  items.forEach(it=>{ const c=it.card;
    if (!c.k && c.p==='형용사') { const r=adjFlag(c.w,it.form); if(r) f[c.id]=r; }
    if (c.k==='shift' && c.e && it.tag==='형용사' && verbOnlyForm(c.w,it.form)) f[c.id]='동사로 쓰인 듯?';
  });
  return f;
}
function scoreOf(tid){
  const res=(S.judge&&S.judge.res[tid]) || freshRes(tid);
  const items=subItems(tid);
  const sc={words:0,kinds:0,complete:0,mission:0,shift:0,trap:0,err:0,fix:0,total:0,kindList:[],missionList:[]};
  if (!items.length) return sc;
  const kinds=new Set(); const mlist=[];
  items.forEach(it=>{ const c=it.card; if(c.k==='trap'){ sc.trap-=3; return; } sc.words++;
    const e=effPos(it,res); if(e) kinds.add(e);
    if (c.k==='shift' && e) sc.shift+=3;
    if (res.errs[c.id]) sc.err-=3;
    mlist.push({p: c.st ? c.p : (c.k==='shift' ? (e||it.tag) : c.p), s:c.s, k:c.k, cop:c.cop});
  });
  sc.kindList=[...kinds]; sc.kinds=kinds.size*2; sc.complete=kinds.size>=9?10:0;
  S.missions.forEach(mid=>{ const m=MISSION_BY[mid]; const ok = m.auto ? !!m.auto(mlist) : !!res.man[mid]; if(ok){ sc.mission+=3; sc.missionList.push(mid);} });
  sc.fix = res.fixUsed ? -2 : 0;
  sc.total = res.state==='zero' ? 0 : Math.max(0, sc.words+sc.kinds+sc.complete+sc.mission+sc.shift+sc.trap+sc.err+sc.fix);
  return sc;
}
function startJudge(){
  const order=shuffle(S.teams.filter(t=>S.subs[t.id]).map(t=>t.id));
  S.phase='judge'; S.build=null;
  S.judge={order, i:0, res:{}, presenter:''};
  if (order.length) enterJudge(); else S.phase='rank';
}
function enterJudge(){
  const j=S.judge, tid=j.order[j.i]; if(!tid) return;
  const prev=j.res[tid]; j.res[tid]=Object.assign(freshRes(tid), prev&&prev.fixUsed?{fixUsed:true}:{});
  const t=T(tid); j.presenter = t.members.length ? pick(t.members) : t.name;
}
function judgeNext(){
  const j=S.judge; j.i++;
  if (j.i>=j.order.length){ if(Object.keys(S.fixReq).length){ j.i=j.order.length; } else { S.phase='rank'; } }
  else enterJudge();
  commit();
}
function rankList(){
  return S.teams.map(t=>({t, sc:scoreOf(t.id)})).sort((a,b)=>b.sc.total-a.sc.total || b.sc.kinds-a.sc.kinds || b.t.coins-a.t.coins);
}

/* ---------- 태블릿에서 온 요청 처리 ---------- */
function handleEvent(ev){
  if (!ev || !ev.t) return;
  if (ev.t==='join'){
    if (S.phase!=='lobby') return;
    if (S.teams.find(t=>t.cid===ev.cid)) return;
    if (S.teams.length>=MAX_TEAMS) return;
    addTeam(String(ev.name||'').slice(0,14), arr(ev.members).map(m=>String(m).slice(0,8)).filter(Boolean).slice(0,4), ev.cid);
    return;
  }
  const t=S.teams.find(x=>x.cid && x.cid===ev.cid); if(!t) return;
  if (ev.t==='draw' && S.phase==='starter') { drawStarter(t.id, ev.g); commit(); }
  else if (ev.t==='bid' && S.phase==='auction' && S.au && ev.card===S.au.cid) secretBid(t.id, ev.amt);
  else if (ev.t==='raise' && S.phase==='auction' && S.au && ev.card===S.au.cid) raise(t.id, ev.to);
  else if (ev.t==='buy') marketBuy(t.id, ev.card);
  else if (ev.t==='submit') acceptSubmit(t.id, ev);
}
function addTeam(name, members, cid){
  const used=new Set(S.teams.map(t=>t.an));
  const id='t'+(S.seq++); const an=ANIMALS.find(a=>!used.has(a))||'⭐';
  S.teams.push({id, name: name || (S.teams.length+1)+'모둠', members, cid:cid||'', an, coins:S.cfg.coins, hand:[], starter:0, bought:0});
  SND.pop(); commit();
}
async function openRoom(){
  if (S.cfg.net!=='on'){ S.code = S.code || String(1000+rnd(9000)); S.phase='lobby'; commit(); return; }
  UI.modal={type:'msg', title:'방을 만드는 중…', text:'인터넷에 연결하고 있어요.'}; renderBoard();
  try{
    await Promise.race([DB.init(), sleep(9000).then(()=>{throw new Error('timeout');})]);
    let code; for(let i=0;i<6;i++){ code=String(1000+rnd(9000)); const ex=await Promise.race([DB.api.get(roomPath(code)+'/pub'), sleep(5000).then(()=>null)]); if(!ex) break; }
    S.code=code; S.phase='lobby'; UI.modal=null; listenRoom(); commit();
  }catch(e){
    UI.modal={type:'neterr'}; renderBoard();
  }
}
function listenRoom(){
  if (unsubIn) unsubIn();
  const base=roomPath(S.code);
  unsubIn = DB.api.onAdd(base+'/in', (k,v)=>{ try{ handleEvent(v); }catch(e){ console.error(e); } DB.api.remove(base+'/in/'+k); });
  publish();
}

/* 시간 흐름 (0.2초마다) */
function tickTeacher(){
  if (!S) return;
  const au=S.au, now=DB.now();
  if (S.phase==='auction' && au && au.status==='bid'){
    const left=au.deadline-now;
    if (left<=3200 && left>0){ const sec=Math.ceil(left/1000); if(au.ticked!==sec){ au.ticked=sec; SND.tick(); } }
    if (left<=0){
      if (au.mode==='secret') doReveal();
      else if (au.leader) sell(au.leader, au.price);
      else if (au.duel){ au.status='rps'; commit(); }
      else unsold();
    }
  }
  if (S.phase==='market' && S.market && now>S.market.deadline){ startBuild(); commit(); }
  updateTimers();
}

function renderBoard(){
  if (!S || !$('#board')) return;
  const keepBuilder = UI.modal && UI.modal.type==='builder' && UI.builder;
  const v = {intro:viewIntro, setup:viewSetup, lobby:viewLobby, starter:viewStarter, episode:viewEpisode, auction:viewAuction, market:viewMarket, build:viewBuild, judge:viewJudge, rank:viewRank}[S.phase] || viewIntro;
  if (keepBuilder){ /* 대신 만들기 중에는 화면을 새로 그리지 않음 */ updateTimers(); return; }
  BGM.setScene(SCENE_OF[S.phase]||'lobby');
  let html=v(); const mh=modalHTML();
  html = html.replace(/<\/div>$/, mh+'</div>');
  $('#board').innerHTML = html; boardFit(); updateTimers();
  if (UI.modal && UI.modal.type==='builder'){ const t=T(UI.modal.tid); UI.builder = Builder($('#bHost'), {cards:t.hand.map(id=>cardPub(C(id))), init:S.subs[t.id], compact:true}); }
}
function updateTimers(){
  if (!S) return; const now=DB.now();
  let dl=0, total=1, lab='';
  if (S.phase==='auction' && S.au && S.au.status==='bid'){ dl=S.au.deadline; total = S.au.mode==='open' && (S.au.leader||S.au.duel) ? (S.au.duel&&!S.au.leader?8000:5000) : S.cfg.bidSec*1000; }
  else if (S.phase==='market' && S.market) { dl=S.market.deadline; total=90000; }
  else if (S.phase==='build' && S.build) { dl=S.build.deadline; total=S.cfg.finalMin*60000; }
  const el=$('#tm'); if(!el||!dl) return;
  const left=Math.max(0,dl-now), L=2*Math.PI*72;
  const arc=el.querySelector('.arc'); if(arc) arc.setAttribute('stroke-dashoffset', L*(1-Math.min(1,left/total)));
  const n=el.querySelector('.n'); const txt = left>=60000 ? fmt(left) : (S.phase==='auction' ? String(Math.ceil(left/1000)) : fmt(left)); if(n && n.textContent!==txt) n.textContent=txt;
  el.classList.toggle('hot', left<=5000);
  const g=$('#going'); if(g && S.au && S.au.mode==='open' && S.au.leader){ const s=Math.ceil(left/1000); g.textContent = s<=3 ? ['','하나… 낙찰!','둘…','셋…'][s]||'' : ''; }
}

/* ---------- 칠판 버튼 ---------- */
function boardAct(act, d){
  const cfgKeys=['rounds','perRound','bidSec','coins','specialFrom','finalMin'];
  switch(act){
    case 'toSetup': if(S.phase==='intro' && S._resumable){ const old=S; S=newState(); S.cfg=old.cfg; } S.phase='setup'; S._resumable=false; break;
    case 'resume': { const saved=ls.get(LS_T,null); if(saved){ S=saved; S._resumable=false; if(S.au&&S.au.status==='reveal'){ S.au.status='bid'; S.au.deadline=0; } if(S.cfg.net==='on' && S.code){ DB.init().then(()=>{ listenRoom(); publish(); renderBoard(); }).catch(()=>{ UI.modal={type:'neterr'}; renderBoard(); }); } } break; }
    case 'toIntro': S.phase='intro'; break;
    case 'cfg': { let v=d.v; if(cfgKeys.includes(d.k)) v=+v; else if(v==='true'||v==='false') v=(v==='true'); S.cfg[d.k]=v; SND.on=S.cfg.sound; if(d.k==='bgm'){ BGM.on=v; if(v) BGM.start(); else BGM.stop(); } break; }
    case 'openRoom': UI.modal=null; openRoom(); return;
    case 'goOffline': S.cfg.net='off'; UI.modal=null; openRoom(); return;
    case 'addTeam': if(S.teams.length<MAX_TEAMS){ UI.modal={type:'addTeam'}; renderBoard(); setTimeout(()=>$('#atName')&&$('#atName').focus(),50); } return;
    case 'addTeamOk': { const name=$('#atName').value.trim(); const mem=[0,1,2,3].map(i=>$('#atM'+i).value.trim()).filter(Boolean); UI.modal=null; addTeam(name, mem, ''); return; }
    case 'delTeam': S.teams=S.teams.filter(t=>t.id!==d.tid); break;
    case 'toStarter': genDeck(); S.phase='starter'; break;
    case 'toEpisode': S.round=0; S.idx=0; S.phase='episode'; break;
    case 'toAuction': S.phase='auction'; readyAuction(); break;
    case 'mode': if(S.au&&S.au.status==='ready') S.au.mode=d.v; break;
    case 'start': startAuction(); return;
    case 'skip': if(S.au&&S.au.status==='ready'){ unsold(); return; } break;
    case 'revealNow': if(S.au&&S.au.status==='bid') S.au.deadline=DB.now(); return;
    case 'sellNow': if(S.au&&S.au.leader){ sell(S.au.leader,S.au.price); return; } break;
    case 'unsoldNow': if(S.au&&S.au.status==='bid'){ unsold(); return; } break;
    case 'rpsWin': sell(d.tid, S.au.price); return;
    case 'next': if(S.au && (S.au.status==='sold'||S.au.status==='unsold')){ nextCard(); return; } break;
    case 'closeMarket': startBuild(); break;
    case 'addTime': if(S.build) S.build.deadline=Math.max(S.build.deadline,DB.now())+60000; break;
    case 'toJudge': UI.modal={type:'confirm', title:'판정을 시작할까요?', text: S.teams.every(t=>S.subs[t.id]) ? '모든 팀이 제출했어요.' : '아직 내지 않은 팀은 0점이 됩니다.', ok:'judgeGo', okLabel:'판정 시작'}; break;
    case 'judgeGo': UI.modal=null; startJudge(); break;
    case 'errT': { const r=S.judge.res[S.judge.order[S.judge.i]]; if(r.state==='pending') r.errs[d.id]=!r.errs[d.id]; break; }
    case 'shiftT': { const r=S.judge.res[S.judge.order[S.judge.i]]; if(r.state==='pending') r.shift[d.id]=r.shift[d.id]===false; break; }
    case 'shiftSet': { const r=S.judge.res[S.judge.order[S.judge.i]]; if(r.state==='pending') r.shift[d.id]=d.v==='1'; break; }
    case 'errSet': { const r=S.judge.res[S.judge.order[S.judge.i]]; if(r.state==='pending') r.errs[d.id]=d.v==='1'; break; }
    case 'manM': { const r=S.judge.res[S.judge.order[S.judge.i]]; if(r.state==='pending') r.man[d.id]=!r.man[d.id]; break; }
    case 'judgeOk': S.judge.res[S.judge.order[S.judge.i]].state='ok'; SND.sold(); break;
    case 'judgeZero': S.judge.res[S.judge.order[S.judge.i]].state='zero'; SND.bad(); break;
    case 'judgeFix': { const tid=S.judge.order[S.judge.i]; S.judge.res[tid].state='fix'; S.judge.res[tid].fixUsed=true; S.fixReq[tid]=true; break; }
    case 'judgeUndo': { const tid=S.judge.order[S.judge.i]; const r=S.judge.res[tid]; if(r.state==='fix'){ delete S.fixReq[tid]; r.fixUsed=false; } r.state='pending'; break; }
    case 'judgeNext': judgeNext(); return;
    case 'rePresenter': { const t=T(S.judge.order[S.judge.i]); if(t.members.length) S.judge.presenter=pick(t.members); break; }
    case 'toRank': S.phase='rank'; break;
    case 'detail': UI.modal={type:'detail'}; break;
    case 'cleanup': UI.modal={type:'confirm', title:'방을 정리할까요?', text:'서버에 저장된 팀 이름·팀원 이름·카드 기록을 모두 지우고 처음 화면으로 돌아갑니다.', ok:'cleanupGo', okLabel:'정리하기'}; break;
    case 'cleanupGo': { if(online()){ DB.api.remove(roomPath(S.code)); } if(unsubIn){unsubIn();unsubIn=null;} const cfg=S.cfg; S=newState(); S.cfg=cfg; UI.modal=null; ls.del(LS_T); break; }
    case 'bgm': S.cfg.bgm=BGM.toggle(); break;
    case 'mclear': BGM.setFile(null); break;
    case 'rules': UI.modal={type:'rules'}; UI.rp=0; renderBoard(); return;
    case 'tGo': UI.rp=+d.tp; renderBoard(); return;
    case 'fs': toggleFS(); return;
    case 'closeModal': UI.modal=null; UI.builder=null; renderBoard(); return;
    case 'team': UI.modal={type:'team', tid:d.tid}; UI.kp=''; renderBoard(); return;
    case 'pDraw': drawStarter(UI.modal.tid, d.g); break;
    case 'kp': { const k=d.k; UI.kp = k==='C' ? '' : k==='←' ? UI.kp.slice(0,-1) : (UI.kp+k).replace(/^0+(?=\d)/,'').slice(0,3); renderBoard(); return; }
    case 'pBid': { const tid=UI.modal.tid; UI.modal=null; secretBid(tid, +UI.kp||0); renderBoard(); return; }
    case 'pRaise': raise(UI.modal.tid, S.au.price + (+d.d)); return;
    case 'pBuy': marketBuy(UI.modal.tid, d.id); return;
    case 'pBuild': UI.modal={type:'builder', tid:UI.modal.tid}; UI.builder=null; renderBoardForce(); return;
    case 'pSubmit': { const b=UI.builder; if(!b) return; const p=b.payload(); if(p.err){ toast(p.err); return; } const tid=UI.modal.tid; UI.modal=null; UI.builder=null; acceptSubmit(tid, p); return; }
  }
  commit();
}
function renderBoardForce(){ const b=UI.builder; UI.builder=null; renderBoard(); }
function toast(msg){ const st=$('#stage')||document.body; const d=document.createElement('div'); d.className='toast'; d.textContent=msg; st.appendChild(d); setTimeout(()=>d.remove(),2200); }
function toggleFS(){ const el=document.documentElement; if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); } else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); } }

function bootBoard(){
  document.body.className='board';
  document.body.innerHTML='<div id="board"></div>';
  const saved=ls.get(LS_T,null);
  S=newState();
  if (saved && saved.phase && !['intro','setup','rank'].includes(saved.phase)) { S.cfg=saved.cfg; S._resumable=true; }
  else if (saved && saved.cfg) S.cfg=saved.cfg;
  SND.on=S.cfg.sound;
  DB.onConn(()=>{ if(S && S.phase!=='intro') renderBoard(); });
  $('#board').addEventListener('click', e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    if (b.dataset.act==='closeModal' && e.target.closest('[data-stop]') && b.closest('[data-stop]')===null) return;
    if (b.dataset.act==='closeModal' && b.classList.contains('modal') && e.target!==b) return;
    if (b.disabled) return;
    boardAct(b.dataset.act, b.dataset);
  });
  BGM.on=S.cfg.bgm!==false;
  const kick=()=>{ if(BGM.on && !BGM.playing && !(BGM.custom && !BGM.custom.paused)) BGM.start(); };
  addEventListener('pointerdown', kick, true); addEventListener('keydown', kick, true);
  $('#board').addEventListener('change', e=>{ if(e.target.id==='mfile'){ const f=e.target.files[0]; if(f){ BGM.setFile(f); S.cfg.bgm=BGM.on=true; BGM.start(); commit(); } } });
  addEventListener('resize', boardFit);
  addEventListener('keydown', e=>{
    if (e.target.tagName==='INPUT') return;
    if (e.key==='f'||e.key==='F') toggleFS();
    if (e.key==='b'||e.key==='B') boardAct('bgm',{});
    if (e.key===' '){ e.preventDefault(); const p=$('.bar .pill.k:not([disabled])')||$('.bar .pill.y:not([disabled])'); if(p) p.click(); }
    if (e.key==='Escape' && UI.modal){ boardAct('closeModal',{}); }
  });
  renderBoard();
  setInterval(tickTeacher, 200);
}

/* =====================================================================
   문장 만들기 (태블릿과 칠판이 같이 씀)
   ===================================================================== */
function Builder(root, opt){
  const cards=opt.cards.filter(Boolean); const byId=Object.fromEntries(cards.map(c=>[c.id,c]));
  let seq=[], sel=-1, end='.';
  if (opt.init && opt.init.cards){ seq=arr(opt.init.cards).filter(x=>byId[x.id]).map(x=>({id:x.id,form:x.form||'',tag:x.tag||'',comma:!!x.comma})); end=opt.init.end||'.'; }
  const needTag=c=>c.st||c.k==='shift';
  const tagOpts=c=>c.st?GROUP_POS[c.g]:c.k==='shift'?c.alt:[];
  const label=c=>c.st?c.g:c.k==='shift'?'🔄 변신':c.p;
  function items(){ return seq.map(x=>Object.assign({},x,{card:byId[x.id]})); }
  function draw(){
    if (opt.onChange) opt.onChange({cards:seq.map(x=>Object.assign({},x)), end});
    const its=items(), ds=displayForms(its);
    const s=seq[sel]; const sc=s?byId[s.id]:null;
    const used=new Set(seq.map(x=>x.id));
    root.innerHTML = `
      <div class="lbl">미리 보기</div><div class="preview">${esc(sentenceText(its,end))||'<span style="color:var(--gray)">아직 비어 있어요</span>'}</div>
      <div class="lbl">문장 줄 · 카드를 누르면 고칠 수 있어요 · 길게 눌러 끌면 자리 바꾸기</div>
      <div class="line" id="bLine">${seq.map((x,i)=>{ const c=byId[x.id]; const miss=needTag(c)&&!x.tag;
        return `<button class="sc2 ${i===sel?'sel':''} ${miss?'need':''}" data-i="${i}">${esc(ds[i])}${x.comma?',':''}<small>${x.tag?esc(x.tag):miss?'품사 고르기!':esc(label(c))}</small></button>`; }).join('')}</div>
      ${sc ? `<div class="tools">
        <div class="r"><button class="tb" data-b="left">◀ 앞으로</button><button class="tb" data-b="right">뒤로 ▶</button><button class="tb ${s.comma?'on':''}" data-b="comma">쉼표 ,</button><button class="tb r" data-b="remove">빼기</button></div>
        ${sc.e ? `<div class="r"><span style="font-weight:800">${sc.cop?'‘이다’ 활용':'활용형'}</span><input class="fld" id="bForm" style="margin:0;flex:1;min-width:160px" value="${esc(s.form||sc.w)}" maxlength="12" autocomplete="off" autocapitalize="off"><button class="tb k" data-b="formOk">적용</button></div><div style="font-size:13px;color:var(--gray);font-weight:700">기본형 <b>${esc(sc.w)}</b> → 문장에 맞게 바꿔 써요. 예) 기쁘다 → 기쁘게, 기뻐서, 기쁜</div>` : ''}
        ${needTag(sc) ? `<div class="r"><span style="font-weight:800">품사</span>${tagOpts(sc).map(p=>`<button class="tb ${s.tag===p?'on':''}" data-b="tag" data-v="${p}">${p}</button>`).join('')}</div>` : ''}
      </div>` : ''}
      <div class="r" style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span class="lbl" style="margin:0">문장 끝</span>${['.','?','!'].map(e=>`<button class="tb ${end===e?'on':''}" data-b="end" data-v="${e}">${e}</button>`).join('')}</div>
      <div class="lbl">가진 카드 · 눌러서 문장에 넣기</div>
      <div class="hand">${cards.map(c=>`<button class="hc ${used.has(c.id)?'used':''}" data-add="${c.id}" ${used.has(c.id)?'disabled':''}><div class="w">${esc(c.w)}</div><div class="p">${esc(label(c))}</div></button>`).join('')}</div>`;
  }
  function applyForm(){ const inp=root.querySelector('#bForm'); if(inp && seq[sel]) seq[sel].form=inp.value.trim(); }
  root.addEventListener('click', e=>{
    const a=e.target.closest('[data-add]'); if(a){ applyForm(); const c=byId[a.dataset.add]; seq.push({id:c.id, form:c.e&&c.k!=='trap'?c.w:'', tag:'', comma:false}); sel=seq.length-1; draw(); return; }
    const ch=e.target.closest('.sc2'); if(ch && !dragging){ applyForm(); const i=+ch.dataset.i; sel = sel===i ? -1 : i; draw(); return; }
    const b=e.target.closest('[data-b]'); if(!b) return; const k=b.dataset.b;
    if (k==='end'){ applyForm(); end=b.dataset.v; draw(); return; }
    if (sel<0) return;
    if (k==='left' && sel>0){ applyForm(); [seq[sel-1],seq[sel]]=[seq[sel],seq[sel-1]]; sel--; }
    else if (k==='right' && sel<seq.length-1){ applyForm(); [seq[sel+1],seq[sel]]=[seq[sel],seq[sel+1]]; sel++; }
    else if (k==='remove'){ seq.splice(sel,1); sel=-1; }
    else if (k==='comma'){ applyForm(); seq[sel].comma=!seq[sel].comma; }
    else if (k==='tag'){ applyForm(); seq[sel].tag=b.dataset.v; }
    else if (k==='formOk'){ applyForm(); }
    draw();
  });
  root.addEventListener('input', e=>{ if(e.target.id==='bForm' && seq[sel]){ seq[sel].form=e.target.value.trim(); const pv=root.querySelector('.preview'); if(pv) pv.textContent=sentenceText(items(),end); } });
  /* 끌어서 자리 바꾸기 */
  let dragging=false, dragI=-1, ghost=null, startX=0, startY=0, timer=null;
  root.addEventListener('pointerdown', e=>{ const ch=e.target.closest('.sc2'); if(!ch) return; dragI=+ch.dataset.i; startX=e.clientX; startY=e.clientY;
    timer=setTimeout(()=>{ dragging=true; ch.classList.add('drag'); ghost=ch.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost); moveGhost(e); },220); });
  const moveGhost=e=>{ if(ghost){ ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; } };
  addEventListener('pointermove', e=>{ if(timer && !dragging && Math.hypot(e.clientX-startX,e.clientY-startY)>10){ clearTimeout(timer); timer=null; } if(dragging){ e.preventDefault(); moveGhost(e); } }, {passive:false});
  addEventListener('pointerup', e=>{ clearTimeout(timer); timer=null; if(!dragging) return;
    const chips=[...root.querySelectorAll('.sc2')]; let to=chips.length;
    for(let i=0;i<chips.length;i++){ const r=chips[i].getBoundingClientRect(); if(e.clientY < r.top) { to=i; break; } if(e.clientY<=r.bottom && e.clientX < r.left + r.width/2){ to=i; break; } }
    const it=seq.splice(dragI,1)[0]; if(to>dragI) to--; seq.splice(to,0,it); sel=to;
    ghost&&ghost.remove(); ghost=null; setTimeout(()=>{dragging=false;},50); draw(); });
  draw();
  return {
    payload(){ applyForm();
      if (seq.length<2) return {err:'카드를 2장 이상 넣어 주세요.'};
      const miss=seq.find(x=>needTag(byId[x.id]) && !x.tag); if(miss) return {err:`‘${byId[miss.id].w}’의 품사를 골라 주세요.`};
      const emp=seq.find(x=>byId[x.id].e && byId[x.id].k!=='trap' && !x.form); if(emp) return {err:`‘${byId[emp.id].w}’의 활용형을 써 주세요.`};
      const ds=displayForms(items());
      return {cards:seq.map((x,i)=>({id:x.id, form: byId[x.id].e ? x.form : ds[i], tag:x.tag, comma:x.comma})), end, text:sentenceText(items(),end)}; },
    text(){ return sentenceText(items(),end); }
  };
}

function padScreenKey(){
  const p=P.pub, t=me(); if(!p) return 'load'; if(!t) return 'join:'+p.phase;

  if (p.phase==='episode') return `ep:${p.round}:${hs}`;
  if (p.phase==='market') return `mk:${hs}:${arr((p.market||{}).cards).map(c=>c.by||'').join(',')}`;
  if (p.phase==='auction') return `au:${au.card&&au.card.id}:${au.status}:${au.mode}:${arr(au.duel).join(',')}:${hs}`;

      const inDuel=!arr(au.duel).length || arr(au.duel).includes(t.id);
      ctl=`<div class="card" style="text-align:center"><h3>${arr(au.duel).length?'⚔️ 공개 결투':'📢 공개 입찰'}</h3><div class="price">현재 최고가<b id="opP">${au.price}</b></div><div class="leader" id="opL"></div><div class="going" id="opG"></div><div style="font-size:15px;font-weight:700;color:var(--gray)">${arr(au.duel).length?'⚔️ 같은 금액을 쓴 팀끼리 다시 겨뤄요.':'+1, +5, +10으로 올려 불러요. 5초 동안 아무도 안 부르면 끝!'}</div>
        ${inDuel?`<div class="steps" style="grid-template-columns:repeat(3,1fr);margin-top:10px">${[1,5,10].map(d=>`<button data-rs="${d}">+${d}</button>`).join('')}</div><div id="opMsg" style="margin-top:8px;font-weight:800;color:var(--gray)"></div>`:`<div class="notice y">같은 금액을 쓴 팀끼리 결투 중이에요. 지켜봐요!</div>`}</div>`;
    }
    else if (au.status==='reveal'){ const mine=arr(au.reveal).find(x=>x.tid===t.id); const r=au.result||{};
      ctl=`<div class="notice ${r.tid===t.id?'':'y'}">공개! 우리 팀 입찰: ${mine?mine.amt:0}코인 ${r.type==='duel'&&arr(r.tids).includes(t.id)?'· ⚔️ 동점! 결투 준비!':''}</div>`; }
    else if (au.status==='sold'){ const r=au.result||{}; ctl = r.tid===t.id ? `<div class="notice" style="font-size:24px">🎉 낙찰! ${r.price}코인</div>` : `<div class="notice y">${esc((arr(p.teams).find(x=>x.id===r.tid)||{}).name||'')} 팀이 가져갔어요 (${r.price}코인)</div>`; }
    else if (au.status==='unsold') ctl=`<div class="notice y">유찰! 이 카드는 떨이 시장에 나와요.</div>`;
    else if (au.status==='rps') ctl=`<div class="notice y">✊✌️🖐 가위바위보로 정해요!</div>`;
    return padCard(c,au) + ctl + missionList(p) + `<div class="card"><h3>가진 카드</h3>${handHTML(t)}</div>`;
  }
  if (ph==='market'){ const mk=p.market||{};
    return `<div class="card"><h3>떨이 시장 <span style="font-size:15px;color:var(--gray)">한 장 5코인 · ${t.bought||0}/2장</span><span id="ptm" style="float:right"></span></h3><div class="hand">${arr(mk.cards).map(c=>`<div class="hc"><div class="w">${esc(c.w)}</div><div class="p">${c.k==='shift'?'🔄 변신':esc(c.p)}</div>${c.by?`<span class="rp" style="background:var(--soft);color:var(--gray)">${esc((arr(p.teams).find(x=>x.id===c.by)||{}).name||'팔림')}</span>`:`<button class="rp" style="background:var(--y);color:var(--ink)" data-buy="${c.id}" ${(t.bought||0)>=2||t.coins<5?'disabled':''}>5코인에 사기</button>`}</div>`).join('')}</div></div>
      <div class="card"><h3>가진 카드</h3>${handHTML(t)}</div>`; }
  if (ph==='build'){
    if (t.sub) return `<div class="wait"><div class="chars solo">${BD('happy','down')}</div><h2>제출 완료!</h2><p>판정을 기다려요. 발표할 사람은 칠판이 정해 줘요.</p></div>`;
    return `<div class="card" style="padding:14px 16px"><div style="display:flex;align-items:center;gap:8px"><h3 style="margin:0;flex:1">최종 문장 만들기</h3><span id="ptm" style="font-size:22px;font-weight:900"></span></div><div style="font-size:15px;color:var(--gray);font-weight:700;margin-top:6px;line-height:1.6">용언은 문장에 맞게 바꿔 써요. 기쁘다 → 기쁘게<br>기본 카드와 🔄 카드는 품사를 골라요 · 뜻도 자연스러워야 ⭕</div></div><div id="pb"></div>${missionList(p)}<div class="pfix"><div class="in"><button class="bb" id="subGo">제출하기</button></div></div>`;
  }
  if (ph==='judge'){
    if (t.fix) return `<div class="notice r" style="margin-bottom:12px">✏️ 선생님이 고쳐 오라고 했어요 (−2점). 다시 만들어 제출해요!</div><div id="pb"></div><div class="pfix"><div class="in"><button class="bb" id="subGo">다시 제출하기</button></div></div>`;
    return `<div class="wait" id="jw"></div>`;
  }
  if (ph==='rank'){ const rk=arr(p.rank); const i=rk.findIndex(x=>x.tid===t.id); const r=rk[i];
    return `<div class="wait"><div class="chars solo">${BD('happy','podium')}</div><h2>${i>=0?`${i+1}위 · ${r.total}점`:'끝!'}</h2><p>칠판에서 최종 순위를 확인해요. 수고했어요!</p></div>`; }
  return `<div class="wait"><h2>칠판을 보세요</h2></div>`;
}
function mountPadBuilder(t){
  const host=$('#pb'); if(!host) return;
  const saved=ls.get('pa-draft-'+P.code+P.cid,null);
  P.builder=Builder(host,{cards:arr(t.hand), init:saved, onChange:d=>ls.set('pa-draft-'+P.code+P.cid,d)});
}
function updatePad(){
  const p=P.pub, t=me(); if(!p||!t) return;
  const co=$('.ph .co'); if(co) co.textContent='💰 '+t.coins;
  const now=DB.now();
  const au=p.au||{};
  const tm=$('#ptm');
  let dl=0; if(p.phase==='auction'&&au.status==='bid') dl=au.deadline; if(p.phase==='market'&&p.market) dl=p.market.deadline; if(p.phase==='build'&&p.build) dl=p.build.deadline;
  if (tm) tm.textContent = dl ? (p.phase==='auction' ? Math.ceil(Math.max(0,dl-now)/1000)+'초' : fmt(dl-now)) : '';
  if (p.phase==='build' && tm && dl && dl<now) tm.textContent='시간 끝! 바로 제출';
  if (p.phase==='auction' && au.status==='bid' && au.mode==='open'){
    const pp=$('#opP'); if(pp) pp.textContent=au.price;
    const lt=arr(p.teams).find(x=>x.id===au.leader); const ll=$('#opL'); if(ll) ll.innerHTML = lt ? (lt.id===t.id?'👑 우리 팀이 최고가!':`${lt.an} ${esc(lt.name)}`) : '아직 아무도…';
    const g=$('#opG'); if(g){ const s=Math.ceil((au.deadline-now)/1000); g.textContent = au.leader && s<=3 && s>0 ? ['','하나…','둘…','셋…'][s] : ''; }
    document.querySelectorAll('[data-rs]').forEach(b=>{ const to=au.price + (+b.dataset.rs); b.disabled = au.leader===t.id || to>t.coins; b.textContent='+'+b.dataset.rs+' → '+to; });
  }
  if (p.phase==='auction' && au.status==='bid' && au.mode==='secret'){
    const m=$('#bidMsg'); const done=arr(au.bidIn).includes(t.id);
    if (m) m.innerHTML = done ? `<div class="notice">입찰 완료: ${P.sentBid??'?'}코인 · 시간 안에는 다시 바꿀 수 있어요</div>` : '';
  }
  if (p.phase==='judge'){ const jw=$('#jw'); if(jw){ const j=p.judge||{}; const res=obj(j.res)[t.id];
    jw.innerHTML = res ? `<div class="chars solo">${res.state==='zero'?BD('worry','down'):BD('happy','up')}</div><h2>${{ok:'⭕ 인정!',zero:'❌ 아쉬워요',fix:'✏️ 고쳐 오기'}[res.state]||''} · ${res.total}점</h2><p>다른 팀 판정을 함께 봐요.</p>`
      : j.tid===t.id ? `<div class="chars solo">${BD('happy','podium')}</div><h2>지금 우리 팀 차례!</h2><p>🎤 발표: <b>${esc(j.presenter)}</b></p>` : `<div class="chars solo">${BD('smile','down')}</div><h2>판정 중 (${(j.i||0)+1}/${j.n||0})</h2><p>칠판을 보세요.</p>`; } }
}
document.addEventListener('click', e=>{ if(!document.body.classList.contains('pad')) return;
  const h=e.target.closest('[data-help]'); if(h){ padHelp(+h.dataset.help); return; }
  if(!e.target.closest('#phelp')) return;
  const g=e.target.closest('[data-act="tGo"]'); if(g){ padHelp(+g.dataset.tp); return; }
  if(e.target.closest('[data-tclose]') || e.target.id==='phelp') padHelp(-1); });
function padClick(e){
  const p=P.pub, t=me();
  const tgt=e.target;
  if (tgt.id==='jAdd'){ const mem=$('#jMem'); const n=mem.querySelectorAll('input').length; if(n<4){ const i=document.createElement('input'); i.className='fld'; i.dataset.m=n; i.maxLength=8; i.placeholder='팀원 '+(n+1); mem.appendChild(i); i.focus(); } return; }
  if (tgt.id==='jGo'){ const name=$('#jName').value.trim(); const members=[...document.querySelectorAll('#jMem input')].map(i=>i.value.trim()).filter(Boolean).slice(0,4);
    if(!name){ alert('팀 이름을 써 주세요.'); return; } if(!members.length){ alert('팀원 이름을 한 명 이상 써 주세요.'); return; }
    ls.set('pa-join-'+P.code,{name,members}); P.joining=true; send({t:'join', name, members}); renderPad(true);
    setTimeout(()=>{ if(!me()){ P.joining=false; renderPad(true); } }, 8000); return; }
  const dr=tgt.closest('[data-draw]'); if(dr && t && (t.starter||0)<5){ if(P.drawPending>Date.now()) return; P.drawPending=Date.now()+700; send({t:'draw', g:dr.dataset.draw}); SND.pop(); dr.animate([{transform:'scale(.9)'},{transform:'none'}],{duration:200}); return; }
  const bd=tgt.closest('[data-bd]'); if(bd && t){ const v=bd.dataset.bd; P.bid = v==='max' ? t.coins : v==='0' ? 0 : Math.max(0, Math.min(t.coins, P.bid + (+v))); $('#bidV').textContent=P.bid; return; }
  if (tgt.id==='bidGo' && t && p.au){ P.sentBid=P.bid; send({t:'bid', amt:P.bid, card:p.au.card.id}); SND.pop(); const m=$('#bidMsg'); if(m) m.innerHTML=`<div class="notice">보내는 중… ${P.bid}코인</div>`; return; }
  const rs=tgt.closest('[data-rs]'); if(rs && t && p.au){ if(rs.disabled) return; send({t:'raise', to:p.au.price + (+rs.dataset.rs), card:p.au.card.id}); SND.pop(); rs.disabled=true; return; }
  const by=tgt.closest('[data-buy]'); if(by && t){ send({t:'buy', card:by.dataset.buy}); by.disabled=true; by.textContent='사는 중…'; return; }
  if (tgt.id==='subGo' && P.builder){ const pl=P.builder.payload(); if(pl.err){ alert(pl.err); return; }
    if(!confirm(`이 문장으로 낼까요?\n\n“${pl.text}”\n\n내고 나면 고칠 수 없어요.`)) return;
    ls.set('pa-draft-'+P.code+P.cid,{cards:pl.cards,end:pl.end}); send(Object.assign({t:'submit'},pl)); tgt.disabled=true; tgt.textContent='보내는 중…'; return; }
}
async function bootPad(code){
  document.body.className='pad';
  document.body.innerHTML='<div id="pad"></div><div class="conn" id="conn"></div>';
  P.code=code; P.base=roomPath(code);
  P.cid=ls.get('pa-cid',null); if(!P.cid){ P.cid='d'+uid()+uid(); ls.set('pa-cid',P.cid); }
  const tq=new URLSearchParams(location.search); if(tq.has('local') && tq.get('cid')) P.cid=tq.get('cid');  /* 시험용 */
  $('#pad').addEventListener('click', padClick);
  renderPad(true);
  try{ await DB.init(); }catch(e){ $('#pad').innerHTML=`<div class="wait"><h2>인터넷에 연결하지 못했어요</h2><p>와이파이를 확인하고 새로 고침해 주세요.</p></div>`; return; }
  DB.onConn(ok=>{ const c=$('#conn'); if(c) c.innerHTML = ok?'<i class="dot"></i>연결됨':'<i class="dot off"></i>연결 끊김'; });
  setTimeout(()=>{ if(!P.pub){ const s=$('#slowMsg'); if(s) s.innerHTML='방을 찾지 못했어요. 방 번호가 맞는지, 칠판에서 방을 만들었는지 확인해 주세요.'; } }, 7000);
  DB.api.on(P.base+'/pub', v=>{ const prevHand=me()?arr(me().hand).length:0; P.pub=v; if(v){ const t=me(); if(t) P.joining=false; } renderPad(false); });
  setInterval(updatePad, 250);
}

/* ---------------- 시작 ---------------- */
function askCode(){
  document.body.className='pad';
  document.body.innerHTML=`<div id="pad"><div class="wait"><div class="chars solo">${BD('happy','up')}</div><h2>품사 경매</h2><p>칠판에 보이는 방 번호 4자리를 넣어요.</p></div><div class="card"><input class="fld" id="cIn" inputmode="numeric" maxlength="4" placeholder="1234" style="font-size:36px;text-align:center;letter-spacing:10px"><button class="bb" id="cGo">들어가기</button><button class="bb l" data-help="0">❓ 게임 설명 보기</button></div></div>`;
  $('#cIn').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#cGo').click(); });
  $('#cGo').onclick=()=>{ const v=$('#cIn').value.trim(); if(/^\d{4}$/.test(v)){ const u=new URL(location.href); u.searchParams.set('join',v); location.href=u.toString(); } };
}
(function boot(){
  const qs=new URLSearchParams(location.search);
  const code=qs.get('join');
  if (code && /^\d{4}$/.test(code)) bootPad(code);
  else if (qs.has('pad')) askCode();
  else bootBoard();
})();

</script>
